[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specfuse-orchestrator"
dynamic = ["version"]
description = "Specfuse orchestrator: initiative coordination drivers for multi-repo Specfuse loops."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Specfuse contributors" }]
keywords = ["specfuse", "agents", "planning", "gate-cycle", "orchestrator"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "jsonschema>=4.18",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "coverage>=7.0",
  "build>=1.0",
]

# DEPRECATED flat console scripts. The suite is driven through the single
# `specfuse` command (`specfuse pm`, `specfuse poller`, `specfuse runner`,
# `specfuse validate-event`, `specfuse validate-frontmatter`); these names
# remain as aliases for standalone `pip install specfuse-orchestrator` users
# and are removed in the coordinated 1.0.0 release train, once every component
# has migrated its own references. Do not drop them unilaterally.
#
# The umbrella dispatches by dotted path, so the targets below are public API:
# renaming a module or its `main()` turns a `specfuse` subcommand into a
# run-time ImportError. Tell specfuse/specfuse in the same PR if one moves.
[project.scripts]
specfuse-orchestrator = "specfuse.orchestrator.cli:main"
specfuse-poller = "specfuse.orchestrator.poller:main"
specfuse-runner = "specfuse.orchestrator.runner:main"
specfuse-validate-event = "specfuse.orchestrator.validate_event:main"
specfuse-validate-frontmatter = "specfuse.orchestrator.validate_frontmatter:main"

[project.entry-points."specfuse.ownership"]
orchestrator = "specfuse.orchestrator:ownership_fragment"

[project.urls]
Homepage = "https://github.com/Specfuse/orchestrator"
Source = "https://github.com/Specfuse/orchestrator"

[tool.ruff]
target-version = "py310"
# Matches the width the package is actually written at; ruff's 88 default would
# make the import sorter (I001) wrap single-line imports that read fine as-is.
line-length = 110
# This pyproject.toml stands up the specfuse-orchestrator package only; the
# pre-existing scripts/** and agents/** trees are not part of this package
# (scripts/** driver migration is gate 2 — see distribution-phase1-workunits.md)
# and are not yet linted as part of any packaging deliverable.
extend-exclude = ["scripts", "agents", "dist", "build"]

# The `lint` gate in .specfuse/verification.yml runs a bare `ruff check .`, so
# the rule set has to be pinned here rather than inherited from whatever ruff
# happens to be installed: ruff widens its implicit defaults between releases,
# and an unpinned selection means the same tree lints green on one machine and
# red on the next. Widen this list deliberately, never by upgrading ruff.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.hatch.version]
path = "specfuse/orchestrator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["specfuse"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "specfuse",
  "shared",
  "agents",
  "hatch_build.py",
  "README.md",
  "LICENSE",
]
