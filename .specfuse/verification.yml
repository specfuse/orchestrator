# .specfuse/verification.yml — gates for the specfuse-orchestrator package.
# code set selected for `implementation` WUs; doc/plannext for closing units.
code:
  - name: tests
    command: "rm -rf dist && python3 -m build --wheel && V=$(mktemp -d) && python3 -m venv \"$V\" && \"$V\"/bin/pip install --quiet dist/*.whl && \"$V\"/bin/python -c 'import specfuse.orchestrator'"
  - name: pytest
    command: "python3 -m pytest -q"
  - name: lint
    command: "ruff check ."
  - name: security
    command: "bandit -r specfuse -ll"
  - name: coverage
    command: "python3 -m coverage run --source=specfuse.orchestrator.paths,specfuse.orchestrator.validate_event,specfuse.orchestrator.validate_frontmatter,specfuse.orchestrator._version,specfuse.orchestrator.check_manifest,specfuse.orchestrator -m pytest -q && python3 -m coverage report --include='specfuse/orchestrator/__init__.py,specfuse/orchestrator/paths.py,specfuse/orchestrator/validate_event.py,specfuse/orchestrator/validate_frontmatter.py,specfuse/orchestrator/_version.py,specfuse/orchestrator/check_manifest.py' --fail-under=90"

doc:
  - name: artifact-changed
    command: "git -C {feature_dir} diff --quiet HEAD -- . && exit 1 || exit 0"

plannext:
  - name: plan-lint
    command: "specfuse lint {feature_dir}"
