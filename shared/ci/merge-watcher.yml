# Specfuse merge-watcher — distributable GitHub Action (install in COMPONENT repos)
#
# Owns the in_review -> done transition (orchestrator-architecture.md §6.3, §10). Merge
# gating itself is GitHub branch protection; this Action only reacts AFTER a PR is merged
# (i.e. after branch protection has already passed). It does not merge anything.
#
# Model B (docs/naming-convention.md): one PR per feature. On feature-PR merge it:
#   1. extracts the feature correlation ID from the PR head branch
#      (feat/INIT-YYYY-NNNN-FNN-slug  ->  INIT-YYYY-NNNN/FNN; legacy FEAT-YYYY-NNNN too),
#   2. flips the feature issue (this repo) to state:done and closes it,
#   3. appends a validated `task_completed` event (source: merge-watcher) to the
#      orchestration repo's events/<INITIATIVE>.jsonl and pushes it.
# The orchestrator poller's next pass sees the feature done and recomputes dependents.
#
# INSTALL: copy to .github/workflows/merge-watcher.yml in the component repo.
# SECRETS (component repo): SPECFUSE_APP_ID + SPECFUSE_APP_PRIVATE_KEY — credentials for the
#   `specfuse-merge-watcher` GitHub App (installed on acme/orchestration with
#   contents:write). The workflow mints a short-lived, orchestrator-scoped installation token
#   at runtime via actions/create-github-app-token. GITHUB_TOKEN (built-in) covers this repo's
#   issues. (Replaces the former long-lived ORCH_TOKEN PAT.)
# See shared/ci/README.md.

name: specfuse-merge-watcher

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

env:
  ORCH_REPO: acme/orchestration

jobs:
  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract feature correlation ID from branch
        id: cid
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          fid=$(printf '%s' "$BRANCH" | grep -oE '(INIT-[0-9]{4}-[0-9]{4}-F[0-9]{2})|(FEAT-[0-9]{4}-[0-9]{4})' | head -1 || true)
          if [ -z "$fid" ]; then
            echo "branch '$BRANCH' carries no specfuse correlation ID — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cid=$(printf '%s' "$fid" | sed -E 's/(INIT-[0-9]{4}-[0-9]{4})-(F[0-9]{2})/\1\/\2/')
          init=$(printf '%s' "$cid" | grep -oE '^(INIT|FEAT)-[0-9]{4}-[0-9]{4}')
          echo "cid=$cid"   >> "$GITHUB_OUTPUT"
          echo "init=$init" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "resolved feature=$cid initiative=$init"

      - name: Flip feature issue to state:done and close
        if: steps.cid.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CID: ${{ steps.cid.outputs.cid }}
        run: |
          set -euo pipefail
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                  --search "[$CID] in:title" --json number -q '.[0].number')
          if [ -z "$num" ] || [ "$num" = "null" ]; then
            echo "no open issue titled [$CID] in $GITHUB_REPOSITORY — nothing to flip"
            echo "ISSUE_NUM=" >> "$GITHUB_ENV"; exit 0
          fi
          for s in state:ready state:in-progress state:in-review state:pending state:blocked-spec state:blocked-human; do
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --remove-label "$s" >/dev/null 2>&1 || true
          done
          gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --add-label state:done
          gh issue close "$num" --repo "$GITHUB_REPOSITORY" --reason completed
          echo "ISSUE_NUM=$num" >> "$GITHUB_ENV"
          echo "issue #$num -> state:done, closed"

      - name: Mint orchestrator installation token
        if: steps.cid.outputs.skip == 'false'
        id: orchtoken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPECFUSE_APP_ID }}
          private-key: ${{ secrets.SPECFUSE_APP_PRIVATE_KEY }}
          owner: acme
          repositories: orchestrator

      - name: Checkout orchestration repo
        if: steps.cid.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: acme/orchestration
          token: ${{ steps.orchtoken.outputs.token }}
          path: orchestrator

      - name: Set up Python
        if: steps.cid.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Append task_completed event to the orchestration event log
        if: steps.cid.outputs.skip == 'false'
        env:
          CID: ${{ steps.cid.outputs.cid }}
          INIT: ${{ steps.cid.outputs.init }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          cd orchestrator
          pip install specfuse-orchestrator
          python3 - "$CID" "$INIT" "$PR_URL" "$MERGE_SHA" "$GITHUB_REPOSITORY" "${ISSUE_NUM:-}" <<'PY'
          import json, sys, datetime, subprocess, pathlib
          cid, init, pr, sha, repo, num = sys.argv[1:7]
          payload = {"pr_url": pr, "merge_commit_sha": sha}
          if num:
              payload["issue"] = f"{repo}#{num}"
          ev = {
              "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "correlation_id": cid,
              "event_type": "task_completed",
              "source": "merge-watcher",
              "source_version": sha or "n/a",
              "payload": payload,
          }
          line = json.dumps(ev)
          tmp = pathlib.Path("/tmp/mw_event.jsonl"); tmp.write_text(line + "\n")
          r = subprocess.run(["specfuse-validate-event", "--file", str(tmp)],
                             capture_output=True, text=True)
          if r.returncode != 0:
              sys.stderr.write(r.stdout + r.stderr)
              sys.exit(1)
          log = pathlib.Path("events") / f"{init}.jsonl"
          with log.open("a") as f:
              f.write(line + "\n")
          print(f"appended task_completed {cid} -> {log}")
          PY
          git config user.name  "specfuse-merge-watcher"
          git config user.email "merge-watcher@specfuse.local"
          git add "events/${INIT}.jsonl"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "event: task_completed ${CID} (merge-watcher)"
          # Tolerate concurrent merges racing on the event log
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed"; break; fi
            echo "push rejected (attempt $attempt) — rebasing"; git pull --rebase --autostash
          done
